<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>404 - Página no encontrada</title>
</head>
<body>
    <div layout:fragment="content" class="text-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="error-template">
                        <h1 class="display-1 text-danger">404</h1>
                        <h2 class="display-4">Página no encontrada</h2>
                        <div class="error-details my-4">
                            Lo sentimos, la página que estás buscando no existe o ha sido movida.
                        </div>
                        <div class="error-actions mt-4">
                            <a href="/" class="btn btn-primary btn-lg me-2">
                                <i class="bi bi-house-door"></i> Ir al Inicio
                            </a>
                            <a href="/personas" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-people"></i> Ver Personas
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Agregar iconos de Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
