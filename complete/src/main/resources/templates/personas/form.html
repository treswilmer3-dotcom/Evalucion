<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${persona.id} ? 'Editar Persona' : 'Nueva Persona'">Formulario de Persona</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-container">
            <h2 class="mb-4" th:text="${persona.id} ? 'Editar Persona' : 'Nueva Persona'">
                Nueva Persona
            </h2>
            
            <form th:action="@{/personas/guardar}" th:object="${persona}" method="post">
                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{id}" />
                
                <div class="mb-3">
                    <label for="cedula" class="form-label">Cédula *</label>
                    <input type="text" class="form-control" id="cedula" th:field="*{cedula}" 
                           placeholder="Ingrese la cédula (solo números)">
                    <div class="text-danger" th:if="${#fields.hasErrors('cedula')}" 
                         th:errors="*{cedula}">Error en cédula</div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" 
                               placeholder="Ingrese el nombre">
                        <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" 
                             th:errors="*{nombre}">Error en nombre</div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">Apellido *</label>
                        <input type="text" class="form-control" id="apellido" th:field="*{apellido}" 
                               placeholder="Ingrese el apellido">
                        <div class="text-danger" th:if="${#fields.hasErrors('apellido')}" 
                             th:errors="*{apellido}">Error en apellido</div>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="edad" class="form-label">Edad *</label>
                    <input type="number" class="form-control" id="edad" th:field="*{edad}" 
                           placeholder="Ingrese la edad" min="1" max="120">
                    <div class="text-danger" th:if="${#fields.hasErrors('edad')}" 
                         th:errors="*{edad}">Error en edad</div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="/personas" class="btn btn-secondary me-md-2">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Agregar iconos de Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Script para validación del lado del cliente -->
    <script>
        // Deshabilitar el envío del formulario si hay campos no válidos
        (function() {
            'use strict';
            
            // Obtener todos los formularios a los que queremos aplicar estilos de validación de Bootstrap
            var forms = document.querySelectorAll('.needs-validation');
            
            // Bucle sobre los formularios y evitar el envío
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
