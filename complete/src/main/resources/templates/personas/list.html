<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Lista de Personas</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="table-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Lista de Personas</h2>
                <a href="/personas/nueva" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nueva Persona
                </a>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Edad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${personas.empty}">
                            <td colspan="6" class="text-center">No hay personas registradas</td>
                        </tr>
                        <tr th:each="persona : ${personas}">
                            <td th:text="${persona.id}"></td>
                            <td th:text="${persona.cedula}"></td>
                            <td th:text="${persona.nombre}"></td>
                            <td th:text="${persona.apellido}"></td>
                            <td th:text="${persona.edad}"></td>
                            <td>
                                <a th:href="@{/personas/editar/{id}(id=${persona.id})}" 
                                   class="btn btn-sm btn-warning me-2">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <a th:href="@{/personas/eliminar/{id}(id=${persona.id})}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('¿Está seguro de eliminar a ' + '[[${persona.nombre}]]' + '?');">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Agregar iconos de Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
</html>
