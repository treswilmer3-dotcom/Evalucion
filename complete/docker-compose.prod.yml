version: '3.8'

services:
  app:
    image: wilinvestiga/spring-boot-app:v1.0.0
    container_name: spring-boot-app
    restart: always
    ports:
      - "8282:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/personasdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL-AUTO=update
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_DB=personasdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:15-alpine
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - postgres_data:/var/lib/postgresql/data
    command: >
      /bin/sh -c '
        while true; do
          PGPASSWORD=postgres pg_dump -h db -U postgres -d personasdb -F c -f /backups/backup_$$(date +%Y%m%d_%H%M%S).dump
          sleep 86400
        done'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
