trigger:
  - main

variables:
  vmImage: 'ubuntu-latest'
  dockerRegistryServiceConnection: 'DockerHub'  
  imageRepository: 'wilinvestiga/spring-boot-app'  
  containerRegistry: 'docker.io'  
  dockerfilePath: 'complete/Dockerfile'
  tag: '$(Build.BuildId)'
  
  # Nombres de contenedores
  appContainerName: 'spring-boot-app'
  dbContainerName: 'postgres-db'

stages:
- stage: Build
  displayName: 'Build y Test'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      vmImage: $(vmImage)
    steps:
    - task: Maven@3
      inputs:
        mavenPomFile: 'complete/pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.11'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'clean package'
    
    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: '$(System.DefaultWorkingDirectory)/complete/target/*.jar'
        artifactName: 'drop'

- stage: BuildAndPushDockerImage
  displayName: 'Construir y Subir Imagen Docker'
  dependsOn: Build
  jobs:
  - job: Docker
    displayName: 'Build and Push'
    pool:
      vmImage: $(vmImage)
    steps:
    - task: Docker@2
      displayName: 'Construir imagen de la aplicación'
      inputs:
        command: 'buildAndPush'
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: '$(tag)'

- stage: DeployToStaging
  displayName: 'Desplegar a Staging (Local)'
  dependsOn: BuildAndPushDockerImage
  jobs:
  - deployment: Deploy
    environment: 'Staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Deteniendo contenedores existentes..."
              docker-compose -f complete/docker-compose.yml down || true
              
              echo "Actualizando imágenes..."
              docker pull $(imageRepository):$(tag)
              
              echo "Iniciando la aplicación..."
              TAG=$(tag) docker-compose -f complete/docker-compose.yml up -d
              
              echo "Verificando el estado de los contenedores..."
              docker ps
              
              echo "La aplicación se está ejecutando en: http://localhost:8282"
            displayName: 'Desplegar en entorno local'

- stage: RunTests
  displayName: 'Ejecutar Pruebas'
  dependsOn: DeployToStaging
  jobs:
  - job: Test
    displayName: 'Ejecutar Pruebas'
    pool:
      vmImage: $(vmImage)
    steps:
    - script: |
        echo "Esperando a que la aplicación esté lista..."
        sleep 30
        
        echo "Ejecutando pruebas de integración..."
        curl -s http://localhost:8282/actuator/health
        
        # Aquí puedes agregar más pruebas como:
        # - Pruebas de API
        # - Pruebas de integración
        # - Pruebas de carga básicas
      displayName: 'Ejecutar pruebas de integración'
      continueOnError: false
